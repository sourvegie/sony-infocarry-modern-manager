name: Windows package

on:
  push:
    branches: [task/P18-034-windows-packaging-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 onedir package (Tk 9)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install official Python 3.15.0rc2 x64 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "python-3.15.0rc2-amd64.exe"
          $installerUrl = "https://www.python.org/ftp/python/3.15.0/python-3.15.0rc2-amd64.exe"
          $expectedSha256 = "a74bf15b3184ea885d39b4eb9b6fc4ac0a696d7bb605d879c024af4433fa72da"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Official Python installer SHA-256 mismatch: $actualSha256"
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP "python-3.15.0rc2-x64"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            "/quiet",
            "InstallAllUsers=0",
            "TargetDir=$installDirectory",
            "PrependPath=0",
            "Include_launcher=0",
            "Include_test=0",
            "Include_tcltk=1",
            "Include_pip=1",
            "Shortcuts=0"
          )
          if ($process.ExitCode -ne 0) {
            throw "Python installer failed with exit code $($process.ExitCode)."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $installDirectory "Scripts")
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDirectory

      - name: Verify build interpreter and Tcl/Tk
        shell: pwsh
        run: |
          python -c "import platform,sys,tkinter; print('Python:', sys.version); print('Architecture:', platform.machine()); print('Tcl/Tk binding:', tkinter.TkVersion); assert platform.machine().casefold() in {'amd64','x86_64'}; assert tkinter.TkVersion >= 9.0"

      - name: Build the pinned onedir package
        shell: pwsh
        run: ./scripts/build_windows_package.ps1

      - name: Run frozen-runtime and application smoke without Python on PATH
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "infocarry-windows-package-smoke"
          $profile = Join-Path $smokeRoot "profile"
          New-Item -ItemType Directory -Force -Path $smokeRoot, $profile | Out-Null
          $env:APPDATA = Join-Path $profile "Roaming"
          $env:LOCALAPPDATA = Join-Path $profile "Local"
          $env:USERPROFILE = $profile
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $launcher = Join-Path (Resolve-Path "dist/InfoCarry Manager").Path "InfoCarry Manager.exe"
          $report = Join-Path $smokeRoot "RUNTIME-SMOKE.json"
          & $launcher --runtime-smoke $report
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw "Packaged runtime smoke failed with exit code $LASTEXITCODE."
          }
          $smoke = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($smoke.status -ne "passed") { throw "Packaged runtime smoke did not pass." }
          Copy-Item -LiteralPath $report -Destination "dist/InfoCarry Manager/RUNTIME-SMOKE-CI.json"
          Get-Content -LiteralPath $report

      - name: Archive the distributable folder
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "InfoCarry-Manager-windows-x64-py3.15.0rc2-tk9.zip"
          Compress-Archive -Path "dist/InfoCarry Manager" -DestinationPath $archive -CompressionLevel Optimal
          Write-Output "Package archive: $archive"

      - name: Publish the Windows x64 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfoCarry-Manager-windows-x64-py3.15.0rc2-tk9
          path: ${{ runner.temp }}/InfoCarry-Manager-windows-x64-py3.15.0rc2-tk9.zip
          if-no-files-found: error
          retention-days: 30
