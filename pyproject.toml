[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infocarry-toolkit"
version = "0.1.0"
description = "Modern read-first tools for the Sony InfoCarry VNW-V15"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "PyUSB==1.3.1",
]

[project.scripts]
infocarry = "infocarry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
